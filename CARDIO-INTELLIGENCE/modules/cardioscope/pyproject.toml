[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cardioscope"
version = "0.1.0"
description = "Reproducible CardioScope data and application foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.7,<1.10",
  "joblib>=1.4,<2",
  "requests>=2.32,<3",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
explanations = ["shap>=0.48,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

