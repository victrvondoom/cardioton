<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f26a32'/%3E%3Cpath d='M18 32h28M32 18v28' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two-family typography system: Inter (geometric sans — display, UI, data),
         JetBrains Mono (technical/telemetry). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CARDIOTON — One Health Interoperability Gateway</title>
    <meta name="description" content="CARDIOTON provides evidence-aware One Health interoperability with provenance, consent and human review across validated OAH/FHIR exchanges." />
    <!-- No-flash theme bootstrap: dark (near-black) is the primary experience;
         the .dark class is only removed when the user explicitly picks light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("clincase-theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased spatial-ui">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
