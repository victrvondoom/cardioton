name: Frozen v1 engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: /tmp/cardioscope-matplotlib
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
          enable-cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '25.3.0'
      - name: Exact frozen CPython (official source and published SHA-256)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils libssl-dev zlib1g-dev libbz2-dev liblzma-dev libffi-dev libsqlite3-dev libreadline-dev
          sh scripts/install_python_linux.sh "$RUNNER_TEMP/cardioscope-python"
          echo "UV_PYTHON=$RUNNER_TEMP/cardioscope-python/bin/python3.12" >> "$GITHUB_ENV"
      - run: make install prepare lint test build
      # prepare verifies the committed subset. No acquisition, split creation or training.
      # Holdout execution tests use only synthetic temporary roots. Real-data tests use development only.
      - name: Four frozen predictions and pinned SHAP reconstruction (development example only)
        run: .venv/bin/python -m scripts.smoke_frozen
      - name: Scientific byte identity after all checks
        run: .venv/bin/python scripts/verify_immutable.py
