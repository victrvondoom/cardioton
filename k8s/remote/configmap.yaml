apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicase-config
  labels:
    app.kubernetes.io/name: clinicase-config
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  CORS_ORIGINS: "https://clinicase.example.com"
  REDIS_URL: ""
  AUTH_DBLESS_DEMO_ENABLED: "false"
  SEED_ON_BOOT: "false"
  INTEROP_RECEIVER_URL: "http://receiver:8091"
  RUNTIME_PLATFORM: "kubernetes"
  RUNTIME_FRONTEND_URL: "http://frontend:5173"
  RUNTIME_FRONTEND_IMAGE: "clinicase-web:release"
  RUNTIME_RECEIVER_IMAGE: "clinicase-api:release"
  CLINICASE_IMAGE: "clinicase-api:release"
