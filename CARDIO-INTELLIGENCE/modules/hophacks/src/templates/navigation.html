<!-- Navigation -->
<nav class="flex justify-between items-center mb-8 bg-gray-50 rounded-lg shadow-sm p-4">
    <div class="flex items-center space-x-4">
        <h1 class="text-2xl font-bold text-gray-800">MedRelay</h1>
        <div class="hidden md:flex space-x-4">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}text-blue-600 hover:text-blue-500{% else %}text-gray-600 hover:text-gray-500{% endif %} font-medium">
                Transcript Generator
            </a>
            <a href="{{ url_for('my_forms') }}" class="{% if request.endpoint == 'my_forms' %}text-blue-600 hover:text-blue-500{% else %}text-gray-600 hover:text-gray-500{% endif %} font-medium">
                My Forms
            </a>
        </div>
    </div>
    
    <div class="flex items-center space-x-4">
        {% if user %}
            {% if selected_patient %}
                <span class="text-gray-600">
                    Patient: {{ selected_patient.patient_info.full_name or selected_patient.patient_info.name or 'Unknown' }}
                </span>
                <a href="{{ url_for('select_patient') }}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium">
                    Switch Patient
                </a>
            {% endif %}
            <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium">
                Logout
            </a>
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}text-blue-600 hover:text-blue-500{% else %}text-gray-600 hover:text-gray-500{% endif %} p-2" title="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </a>
        {% endif %}
    </div>
</nav>
