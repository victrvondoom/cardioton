<!-- CardioTwin Logo Favicon Snippet -->
<!-- Add this to the <head> section of your index.html -->

<!-- Primary favicon (SVG for modern browsers) -->
<link rel="icon" type="image/svg+xml" href="/assets/logos/cardiotwin-icon.svg" />

<!-- Alternative favicon (PNG fallback) -->
<link rel="alternate icon" type="image/png" href="/assets/logos/cardiotwin-icon.png" />

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="/assets/logos/cardiotwin-icon-192.png" />

<!-- Windows Tile -->
<meta name="msapplication-TileImage" content="/assets/logos/cardiotwin-icon-270.png" />
<meta name="msapplication-TileColor" content="#0a0a0a" />

<!-- Theme Color (matches CardioTwin design system) -->
<meta name="theme-color" content="#ff4757" />

<!-- Web App Manifest -->
<link rel="manifest" href="/manifest.json" />

<!-- Open Graph / Social Sharing -->
<meta property="og:image" content="/assets/logos/cardiotwin-logo.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="900" />
<meta property="og:image:type" content="image/png" />
