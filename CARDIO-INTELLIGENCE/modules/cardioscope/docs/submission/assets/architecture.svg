<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc"><title id="title">CardioScope frozen V1 architecture</title><desc id="desc">Runtime validates a 55-feature profile and applies four frozen pipelines. Model outputs feed SHAP and reference anatomy in the React interface. Saved aggregate evaluation is a separate evidence input. Development nested cross-validation, freezing and one-time holdout precede runtime; there is no live training.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#007f83"/></marker></defs><rect width="1080" height="680" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#102c39}.head{font-weight:700;font-size:18px}.small{font-size:15px}.label{font-size:13px;fill:#526570}.line{fill:none;stroke:#007f83;stroke-width:2;marker-end:url(#arrow)}</style><text x="36" y="36" class="head">CardioScope / frozen V1</text><text x="36" y="63" class="label">Runtime inference — no training, threshold tuning or holdout evaluation</text>
<rect x="36" y="90" width="195" height="95" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="51" y="118" class="head">55-feature profile</text>
<text x="51" y="142" class="small">Explicit source schema</text>
<text x="51" y="162" class="small">No hidden defaults</text>
<rect x="270" y="90" width="195" height="95" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="285" y="118" class="head">FastAPI validation</text>
<text x="285" y="142" class="small">Schema / categories</text>
<text x="285" y="162" class="small">Target fields excluded</text>
<rect x="505" y="90" width="230" height="95" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="520" y="118" class="head">4 frozen pipelines</text>
<text x="520" y="142" class="small">CAD / LAD: logistic</text>
<text x="520" y="162" class="small">LCX / RCA: forest</text>
<rect x="775" y="90" width="265" height="95" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="790" y="118" class="head">4 model probabilities</text>
<text x="790" y="142" class="small">Separate classifier outputs</text>
<text x="790" y="162" class="small">Fixed threshold 0.5</text>
<path d="M231,137 H266" class="line"/>
<path d="M465,137 H501" class="line"/>
<path d="M735,137 H771" class="line"/>
<rect x="535" y="225" width="230" height="108" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="550" y="253" class="head">SHAP</text>
<text x="550" y="277" class="small">100 development records</text>
<text x="550" y="297" class="small">Log-odds or probability</text>
<text x="550" y="317" class="small">55 features / reconstruction</text>
