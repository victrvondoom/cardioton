<text x="820" y="253" class="head">Reference 3D anatomy</text>
<text x="820" y="277" class="small">Heart + LAD / LCX / RCA</text>
<text x="820" y="297" class="small">83 verified OBJ leaves</text>
<text x="820" y="317" class="small">Selection / color / controls</text>
<path d="M890,185 V205 H650 V221" class="line"/>
<path d="M925,185 V221" class="line"/>
<rect x="36" y="225" width="430" height="108" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="51" y="253" class="head">Saved aggregate Evidence</text>
<text x="51" y="277" class="small">303 total / 242 development / 61 final holdout</text>
<text x="51" y="297" class="small">Frozen results, uncertainty and limitations</text>
<text x="51" y="317" class="small">No evaluation triggered by the interface</text>
<rect x="300" y="375" width="540" height="95" rx="8" fill="#edf5f5" stroke="#cedfe3"/>
<text x="315" y="403" class="head">React + TypeScript interface</text>
<text x="315" y="427" class="small">Predictions / anatomy / explanations / evidence</text>
