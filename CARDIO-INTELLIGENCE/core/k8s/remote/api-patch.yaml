apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: api
          image: clinicase-api:release
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: JWT_SECRET
            - name: INTEROP_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: INTEROP_RECEIVER_TOKEN
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: DEMO_USER_PASSWORD
            - name: PASSPORT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: PASSPORT_SIGNING_KEY
                  optional: true
