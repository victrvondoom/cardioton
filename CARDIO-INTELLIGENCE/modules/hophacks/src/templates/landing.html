    <script>
        // Typewriter effect for "Compliance"
        document.addEventListener('DOMContentLoaded', function() {
            const typewriterElement = document.getElementById('typewriter');
            const text = 'Compliance';
            let index = 0;
            
            // Start with a delay to allow page to load
            setTimeout(() => {
                function typeWriter() {
                    if (index < text.length) {
                        typewriterElement.textContent += text.charAt(index);
                        index++;
                        // Randomize typing speed between 100-200ms for more natural feel
                        setTimeout(typeWriter, Math.random() * 100 + 100);
                    } else {
                        // Keep the blinking cursor after typing is complete
                        typewriterElement.classList.add('typewriter-text');
                    }
                }
                typeWriter();
            }, 800); // Start typing after 800ms delay
        });
    </script>
